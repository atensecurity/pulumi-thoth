name: Release Pulumi Provider

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (for example 0.1.0, 0.1.0-rc1, v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      current_tag: ${{ steps.release_tag.outputs.current_tag }}
      release_version: ${{ steps.release_tag.outputs.release_version }}
      is_rc: ${{ steps.release_tag.outputs.is_rc }}
    steps:
      - name: Resolve and validate release tag
        id: release_tag
        shell: bash
        env:
          RAW_TAG_INPUT: ${{ github.event.inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            RAW_TAG="${RAW_TAG_INPUT}"
          else
            RAW_TAG="${GITHUB_REF_NAME}"
          fi

          RAW_TAG="$(echo "${RAW_TAG}" | xargs)"
          if [[ -z "${RAW_TAG}" ]]; then
            echo "release_tag is required and cannot be empty." >&2
            exit 1
          fi

          if [[ "${RAW_TAG}" == v* ]]; then
            CURRENT_TAG="${RAW_TAG}"
          else
            CURRENT_TAG="v${RAW_TAG}"
          fi

          if [[ ! "${CURRENT_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "Invalid release tag '${RAW_TAG}' (normalized: '${CURRENT_TAG}')." >&2
            echo "Expected semantic version like 0.1.0 or 0.1.0-rc1." >&2
            exit 1
          fi

          IS_RC=false
          if [[ "${CURRENT_TAG}" == *-rc* ]]; then
            IS_RC=true
          fi

          echo "current_tag=${CURRENT_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_version=${CURRENT_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "is_rc=${IS_RC}" >> "$GITHUB_OUTPUT"

  validate_build_sdks:
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout git history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: provider/go.mod
          check-latest: true
          cache-dependency-path: provider/go.sum

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Ensure tag exists and checkout tag commit
        shell: bash
        env:
          CURRENT_TAG: ${{ needs.prepare.outputs.current_tag }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify "refs/tags/${CURRENT_TAG}" >/dev/null 2>&1; then
            echo "Tag '${CURRENT_TAG}' does not exist in this repository." >&2
            exit 1
          fi
          git checkout --force "refs/tags/${CURRENT_TAG}"

      - name: Clone terraform-provider-thoth for local replace
        run: |
          git clone --depth 1 https://github.com/atensecurity/terraform-provider-thoth.git ../terraform-provider-thoth

      - name: Install Pulumi CLI
        uses: pulumi/setup-pulumi@59f86fcdedc88e5c7f2dd25e3903fa3e055eb14f
        with:
          pulumi-version: latest

      - name: Verify provider and generate SDKs
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -euo pipefail

          (
            cd provider
            env THOTH_PULUMI_RELEASE_STRICT_VERSION=1 GOCACHE=/tmp/gocache \
              go test -ldflags "-X github.com/atensecurity/pulumi-thoth/provider/pkg/version.Version=${RELEASE_VERSION}" ./...
          )

          make schema VERSION="${RELEASE_VERSION}"
          make build VERSION="${RELEASE_VERSION}"
          make sdk VERSION="${RELEASE_VERSION}"

      - name: Normalize SDK versions
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -euo pipefail

          if [[ -f sdk/nodejs/package.json ]]; then
            jq --arg version "${RELEASE_VERSION}" '.version = $version' \
              sdk/nodejs/package.json > sdk/nodejs/package.json.tmp
            mv sdk/nodejs/package.json.tmp sdk/nodejs/package.json
          else
            echo "Node.js SDK not generated; skipping Node.js version normalization."
          fi

          sed -i "s/^VERSION = .*/VERSION = \"${RELEASE_VERSION}\"/" sdk/python/setup.py

          DOTNET_CSPROJ="$(find sdk/dotnet -maxdepth 1 -name '*.csproj' | head -n 1)"
          if [[ -z "${DOTNET_CSPROJ}" ]]; then
            echo "::error::Could not find dotnet SDK project in sdk/dotnet."
            exit 1
          fi

          cat > sdk/dotnet/README.md <<'DOC'
          # AtenSecurity.Pulumi.Thoth.Thoth

          Pulumi provider SDK for the Aten Security Thoth AI governance control plane.
          DOC

          if ! grep -q '<PackageReadmeFile>README.md</PackageReadmeFile>' "${DOTNET_CSPROJ}"; then
            sed -i '/<PackageIcon>logo.png<\/PackageIcon>/a\    <PackageReadmeFile>README.md</PackageReadmeFile>' "${DOTNET_CSPROJ}"
          fi

          if ! grep -q '<None Include="README.md">' "${DOTNET_CSPROJ}"; then
            sed -i '/<\/Project>/i\  <ItemGroup>\n    <None Include="README.md">\n      <Pack>True</Pack>\n      <PackagePath></PackagePath>\n    </None>\n  </ItemGroup>\n' "${DOTNET_CSPROJ}"
          fi

          printf '%s\n' "${RELEASE_VERSION}" > sdk/dotnet/version.txt

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -euo pipefail

          NOTES="$(
            awk -v version="${RELEASE_VERSION}" '
              $1 == "##" {
                if (capture && $2 != version) { exit }
                if ($2 == version) { capture=1 }
              }
              capture {print}
            ' CHANGELOG.md
          )"

          if [[ -z "${NOTES//[[:space:]]/}" ]]; then
            echo "Missing release notes in CHANGELOG.md for version ${RELEASE_VERSION}" >&2
            echo "Expected section heading: ## ${RELEASE_VERSION} - YYYY-MM-DD" >&2
            exit 1
          fi

          printf '%s\n' "${NOTES}" > release_notes.md

      - name: Build Go SDK bundle
        shell: bash
        env:
          CURRENT_TAG: ${{ needs.prepare.outputs.current_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C sdk/go -czf "dist/pulumi-thoth-go-sdk-${CURRENT_TAG}.tar.gz" .

      - name: Upload release inputs artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pulumi-thoth-release-inputs
          path: |
            sdk
            dist/pulumi-thoth-go-sdk-*.tar.gz
            release_notes.md

  release_provider:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - validate_build_sdks
    steps:
      - name: Checkout git history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: provider/go.mod
          check-latest: true
          cache-dependency-path: provider/go.sum

      - name: Fetch tags
        run: git fetch --force --tags

      - name: Ensure tag exists and checkout tag commit
        shell: bash
        env:
          CURRENT_TAG: ${{ needs.prepare.outputs.current_tag }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify "refs/tags/${CURRENT_TAG}" >/dev/null 2>&1; then
            echo "Tag '${CURRENT_TAG}' does not exist in this repository." >&2
            exit 1
          fi
          git checkout --force "refs/tags/${CURRENT_TAG}"

      - name: Clone terraform-provider-thoth for local replace
        run: |
          git clone --depth 1 https://github.com/atensecurity/terraform-provider-thoth.git ../terraform-provider-thoth

      - name: Download release inputs artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pulumi-thoth-release-inputs

      - name: Export release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "RELEASE_NOTES<<EOF"
            cat release_notes.md
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Import release signing key
        id: gpg
        shell: bash
        env:
          THOTH_PULUMI_PROVIDER_GPG_PRIVATE_KEY: ${{ secrets.THOTH_PULUMI_PROVIDER_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${THOTH_PULUMI_PROVIDER_GPG_PRIVATE_KEY}" ]]; then
            echo "Missing secret THOTH_PULUMI_PROVIDER_GPG_PRIVATE_KEY" >&2
            exit 1
          fi

          TMP_KEY_FILE="$(mktemp)"
          printf '%s\n' "${THOTH_PULUMI_PROVIDER_GPG_PRIVATE_KEY}" > "${TMP_KEY_FILE}"
          gpg --batch --import "${TMP_KEY_FILE}"
          rm -f "${TMP_KEY_FILE}"

          FINGERPRINT="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          if [[ -z "${FINGERPRINT}" ]]; then
            echo "Unable to determine imported GPG fingerprint" >&2
            exit 1
          fi
          echo "fingerprint=${FINGERPRINT}" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.THOTH_PULUMI_PROVIDER_GPG_PASSPHRASE }}

  publish_npm:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - validate_build_sdks
      - release_provider
    if: ${{ needs.prepare.outputs.is_rc != 'true' }}
    steps:
      - name: Download release inputs artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pulumi-thoth-release-inputs

      - name: Set up Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4.0.2
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -euo pipefail

          if [[ ! -f "sdk/nodejs/package.json" ]]; then
            echo "Node.js SDK not generated; skipping npm publish."
            exit 0
          fi

          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::error::Missing NPM_TOKEN secret."
            exit 1
          fi

          cd sdk/nodejs

          npm view "@atensec/pulumi-thoth@${RELEASE_VERSION}" version >/dev/null 2>&1 && {
            echo "@atensec/pulumi-thoth@${RELEASE_VERSION} already published; skipping."
            exit 0
          }

          npm install
          npm run build
          npm publish --access public

  publish_nuget:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - validate_build_sdks
      - release_provider
    if: ${{ needs.prepare.outputs.is_rc != 'true' }}
    steps:
      - name: Download release inputs artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pulumi-thoth-release-inputs

      - name: Set up .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: "8.0.x"

      - name: Build and publish NuGet package
        working-directory: sdk/dotnet
        env:
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -euo pipefail

          if [[ -z "${NUGET_TOKEN:-}" ]]; then
            echo "::error::Missing NUGET_TOKEN secret."
            exit 1
          fi

          PROJECT_PATH="$(find . -maxdepth 2 -name '*.csproj' | head -n 1)"
          if [[ -z "${PROJECT_PATH}" ]]; then
            echo "::error::Could not find a dotnet SDK project in sdk/dotnet."
            exit 1
          fi

          dotnet restore "${PROJECT_PATH}"
          dotnet build "${PROJECT_PATH}" \
            -c Release \
            -p:Version="${RELEASE_VERSION}" \
            -p:GeneratePackageOnBuild=false
          dotnet pack "${PROJECT_PATH}" \
            -c Release \
            --no-build \
            -p:Version="${RELEASE_VERSION}" \
            -p:GeneratePackageOnBuild=false \
            -o ./artifacts
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "${NUGET_TOKEN}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

  publish_pypi:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - validate_build_sdks
      - release_provider
    if: ${{ needs.prepare.outputs.is_rc != 'true' }}
    environment:
      name: pypi
      url: https://pypi.org/project/pulumi-thoth/
    steps:
      - name: Download release inputs artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pulumi-thoth-release-inputs

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build Python SDK package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build
          python -m build sdk/python

      - name: Publish PyPI package (Trusted Publisher)
        id: publish_pypi_trusted
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: sdk/python/dist/

      - name: Resolve PyPI fallback token
        id: resolve_pypi_token
        if: steps.publish_pypi_trusted.outcome != 'success'
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          PYPY_TOKEN: ${{ secrets.PYPY_TOKEN }}
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          TOKEN="${PYPI_TOKEN:-}"
          if [[ -z "${TOKEN}" ]]; then
            TOKEN="${PYPY_TOKEN:-}"
          fi
          if [[ -z "${TOKEN}" ]]; then
            TOKEN="${PYPI_API_TOKEN:-}"
          fi

          if [[ -n "${TOKEN}" ]]; then
            echo "::add-mask::${TOKEN}"
            echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish PyPI package (token fallback)
        id: publish_pypi_token
        if: steps.publish_pypi_trusted.outcome != 'success' && steps.resolve_pypi_token.outputs.token != ''
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: sdk/python/dist/
          user: __token__
          password: ${{ steps.resolve_pypi_token.outputs.token }}

      - name: Fail if PyPI publish did not succeed
        if: steps.publish_pypi_trusted.outcome != 'success' && steps.publish_pypi_token.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::PyPI publish failed for pulumi-thoth."
          echo "::error::Trusted Publisher OIDC path failed and token fallback did not succeed."
          exit 1

  publish_go_sdk:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - validate_build_sdks
      - release_provider
    if: ${{ needs.prepare.outputs.is_rc != 'true' }}
    steps:
      - name: Download release inputs artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pulumi-thoth-release-inputs

      - name: Upload Go SDK bundle to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ needs.prepare.outputs.current_tag }}
        run: |
          set -euo pipefail
          gh release upload "${CURRENT_TAG}" "dist/pulumi-thoth-go-sdk-${CURRENT_TAG}.tar.gz" --clobber
